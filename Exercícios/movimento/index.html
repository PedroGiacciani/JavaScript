<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentação</title>
    <style>
        div#personagem{
            border-radius: 50%;
            width: 40px;
            height: 40px;
            background-color: black;
            position: absolute;
            top: 1000px;
            left: 1000px;
        }
    </style>
</head>
<body>
    <div id="personagem"></div>
    <script>
        var per = document.getElementById('personagem')

        var x = 0
        var y = 0
        document.addEventListener('keydown', (event) => {
            if(event.key == 'w'){
                y -= 20
            } else if(event.key == 's'){
                y += 20
            } else if(event.key == 'a'){
                x -= 20
            }else if(event.key == 'd'){
                x += 20
            }

            per.style.top = y + 'px'
            per.style.left = x + 'px'
        })
    </script>
</body>
</html>
