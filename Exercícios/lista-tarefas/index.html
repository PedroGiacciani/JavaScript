<!DOCTYPE html>
<html lang="pt-br">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/52ff4c741b.js" crossorigin="anonymous"></script>
</head>
<body id="corpo">
    <div id="separador">
        <header>
            <h1>Minha Tarefas</h1>
        </header>
        <main>
            <div id="menu">
                <p><input type="text" placeholder="Digite uma tarefa" name="campoTarefa" id="icampoTarefa"> <button id="btn-tarefa">Adicionar tarefa</button></p>
            </div>
            <div id="filtroTarefas">
                <p>Filtro:
                    <select name="Filtro" id="ifiltro">
                        <option value="Todas">Todas</option>
                        <option value="false">Em andamento</option>
                        <option value="true">Concluídas</option>
                    </select>
                </p>
                <p>Pesquisar tarefa: <input type="text" name="pesquisaTarefa" id="ipesquisaTarefa" placeholder="Digite aqui a tarefa"></p>
            </div>
            <div id="lista-tarefas">

            </div>
            <p id="tarefas-concluidas"></p>
        </main>
    </div>
    <footer>
        <p>&copy; Desenvolvido por <a href="https://github.com/pedrogiacciani">Pedro Giacciani</a></p>
    </footer>
    <script type="module" src="scripts/app.js"></script>
</body>
</html>
